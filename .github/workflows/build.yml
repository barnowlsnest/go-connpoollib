name: 'build.yml'
run-name: 'Build and Test'

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # probe_unix.go has OS-specific syscall behavior: test both linux and darwin.
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Build
        run: task go-build

      - name: Test
        run: task go-test
